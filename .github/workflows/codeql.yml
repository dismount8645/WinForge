name: CodeQL
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 1'
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  analyze:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - uses: github/codeql-action/init@v3
        with:
          languages: csharp
      - run: dotnet build WinForge.sln --configuration Release --nologo
        continue-on-error: true
      - uses: github/codeql-action/analyze@v3
