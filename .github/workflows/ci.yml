name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'
      - run: dotnet build WinForge.sln --configuration Release --nologo
        continue-on-error: true
      - run: dotnet test --if-present
        continue-on-error: true
